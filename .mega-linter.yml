---
DISABLE_LINTERS:
  # Skipping for now.
  - HTML_DJLINT
  - HTML_HTMLHINT
  # Revive covers this, plus golangci-lint has trouble with newer go toolchains
  # in go.mod.
  - GO_GOLANGCI_LINT
  # Link checking more likely to cause false positives than be useful for us.
  - SPELL_LYCHEE
  # yamllint is sufficient for us.
  - YAML_PRETTIER
DISABLE_ERRORS_LINTERS:
  # These are informative but don't need to break the build.
  - COPYPASTE_JSCPD
  # There's no easy local feedback loop for spelling issues before
  # pushing, so keep them non-blocking to avoid unnecessary PR cycles
  # for words that just need adding to the dictionary.
  - SPELL_CSPELL
GITHUB_COMMENT_REPORTER: false
