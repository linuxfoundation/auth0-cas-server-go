---
receivers:
  # OTLP will receive traces from our application. Newer collector versions
  # default this to binding localhost only; bind 0.0.0.0 explicitly so
  # other containers on the compose network (e.g. auth0-cas-server-go) can
  # reach it.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
  # The hostmetrics receiver is required to get correct infrastructure metrics
  # in Datadog.
  hostmetrics:
    collection_interval: 10s
    scrapers:
      paging:
        metrics:
          system.paging.utilization:
            enabled: true
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      disk:
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      load:
      memory:
      network:
      processes:
  # The prometheus receiver scrapes metrics needed for the OpenTelemetry
  # Collector Dashboard.
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otelcol'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']

processors:
  # Datadog APM Intake limit is 3.2MB. Let's make sure the batches do not
  # go over that.
  batch:
    send_batch_max_size: 1000
    send_batch_size: 100
    timeout: 10s
  resource:
    attributes:
      - key: deployment.environment
        value: ${DD_ENV}
        action: upsert

exporters:
  datadog:
    api:
      key: ${DD_API_KEY}
    traces:
      ignore_resources: ["GET /ping"]
  # Jaeger has accepted OTLP natively since 1.35, so we export to it via
  # OTLP instead of the removed jaeger exporter.
  otlp/jaeger:
    endpoint: jaeger-all-in-one:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [hostmetrics, prometheus]
      processors: [resource, batch]
      exporters: [datadog]
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [datadog, otlp/jaeger]
