<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login Error</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Source Sans Pro",
                    sans-serif;
                background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .error-container {
                background: white;
                border-radius: 12px;
                padding: 40px;
                box-shadow:
                    0 20px 25px -5px rgba(0, 0, 0, 0.1),
                    0 10px 10px -5px rgba(0, 0, 0, 0.04);
                text-align: center;
                max-width: 500px;
                width: 100%;
            }

            .error-icon {
                width: 80px;
                height: 80px;
                margin: 0 auto 24px;
                background: #fee2e2;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .error-icon svg {
                width: 40px;
                height: 40px;
                color: #dc2626;
            }

            .error-title {
                font-size: 24px;
                font-weight: 600;
                color: #1f2937;
                margin-bottom: 12px;
            }

            .error-message {
                font-size: 16px;
                color: #6b7280;
                line-height: 1.5;
                margin-bottom: 32px;
            }

            .back-button {
                background: #4f46e5;
                color: white;
                border: none;
                border-radius: 8px;
                padding: 12px 24px;
                font-size: 14px;
                font-weight: 500;
                cursor: pointer;
                transition: background-color 0.2s ease;
                display: inline-flex;
                align-items: center;
                gap: 8px;
            }

            .back-button:hover {
                background: #4338ca;
            }

            .back-button:focus {
                outline: none;
                box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.3);
            }

            .back-icon {
                width: 16px;
                height: 16px;
            }

            @media (max-width: 480px) {
                .error-container {
                    padding: 24px;
                }

                .error-title {
                    font-size: 20px;
                }

                .error-message {
                    font-size: 14px;
                }
            }
        </style>
    </head>
    <body>
        <div class="error-container">
            <div class="error-icon">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.732-.833-2.5 0L4.268 16.5c-.77.833.192 2.5 1.732 2.5z"
                    />
                </svg>
            </div>

            <h1 class="error-title">Error {{.StatusCode}}</h1>

            <p class="error-message">{{.Message}}</p>

            {{if .ShowBackButton}}
            <button onclick="history.back()" class="back-button">
                <svg
                    class="back-icon"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"
                    />
                </svg>
                Go Back
            </button>
            {{end}}
        </div>
    </body>
</html>
