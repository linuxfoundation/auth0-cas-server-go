name: Image Scan

"on":
  pull_request: null

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    name: Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.18.0
      - run: |
          ko build . --push=false --tarball "${RUNNER_TEMP}/image.tar" \
            --bare \
            --platform linux/arm64 \
            --sbom spdx
      - name: Install trufflehog via shell pipe
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
      - name: Run trufflehog on image.tar
        run: |
          trufflehog --github-actions \
            --fail --no-update \
            --results=verified,unknown \
            filesystem "${RUNNER_TEMP}/image.tar"
